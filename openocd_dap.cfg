# OpenOCD configuration for this board: WCH CMSIS-DAP probe + STM32H723VGTx.
#
# Used by the VS Code debug configurations in .vscode/launch.json and by
# `cmake --build build --target flash`.

# ------------------------------------------------------------------------------
# Probe
# ------------------------------------------------------------------------------
# The probe on this bench is a WCH CMSIS-DAP (USB 1a86:e6e1), not an ST-Link.
# cmsis-dap.cfg speaks the generic CMSIS-DAP protocol so any compliant probe
# works, but OpenOCD's built-in VID/PID list does not include WCH's — without
# the line below the probe is simply "not found" with no hint as to why.
source [find interface/cmsis-dap.cfg]
cmsis_dap_vid_pid 0x1a86 0xe6e1

transport select swd

# ------------------------------------------------------------------------------
# Target
# ------------------------------------------------------------------------------
# H7, not the stm32f4x.cfg this project used before the port. Not
# interchangeable: different flash driver and different sector geometry (8 x
# 128 KB here versus the F407's twelve mixed-size sectors), so the F4 script
# would compute wrong erase boundaries even if it connected.
source [find target/stm32h7x.cfg]

# ------------------------------------------------------------------------------
# Speed
# ------------------------------------------------------------------------------
# Deliberately conservative to start. SWD runs off the probe's clock, and a rate
# the probe or the wiring cannot sustain appears as intermittent "target not
# halted" or CRC errors rather than as anything naming the clock. Raise it once
# the basics work; 10000 is usually fine on a short cable.
adapter speed 4000

# ------------------------------------------------------------------------------
# Reset
# ------------------------------------------------------------------------------
# `none` means: do not use the probe's hardware reset line. Reset is instead done
# through the debug unit, by writing SYSRESETREQ in AIRCR.
#
# @par Why, and how this was established
# This probe's nRESET is not connected to the target. With the srst_only setting
# that was here before, OpenOCD believed a reset had happened when none had: it
# reported the reset as successful while the core stayed exactly where it was.
# Observed directly — `reset halt` left PC at 0x2000002e, still inside a
# HardFault from the previous run, instead of at Reset_Handler. Every observation
# made through that setting was of stale state.
#
# With `none`, `reset halt` behaves: PC lands on Reset_Handler (0x08003298) and
# MSP on 0x20020000, the top of DTCMRAM, with CFSR and HFSR clear.
#
# @par What is given up
# connect_assert_srst is not available without the reset line, so the debugger
# cannot take control *before* the reset vector runs. That matters only for
# faults during clock setup, which happen before SYSRESETREQ can be issued — on
# this target a bad PLL config is the realistic case. If that is ever needed,
# wire nRESET and switch back to:
#
#     reset_config srst_only srst_nogate connect_assert_srst
#
# SYSRESETREQ also does not reset the debug unit or, on H7, every peripheral
# domain — so a peripheral wedged by the previous run can survive it. If a fault
# reproduces only after a soft reset and not after a power cycle, that asymmetry
# is the reason; power-cycle the board before concluding it is a firmware bug.
reset_config none
