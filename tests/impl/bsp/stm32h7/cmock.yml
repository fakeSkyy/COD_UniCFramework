---
:cmock:
  :mock_path: tests/impl/bsp/stm32h7/mocks
  :mock_prefix: mock_
  :verbosity: 2
  :plugins:
    - :ignore
    - :ignore_arg
    - :expect_any_args
    - :callback
    - :return_thru_ptr
  :when_no_prototypes: :warn
  :treat_externs: :include
  :strippables:
    - '(?:__attribute__\s*\(\([^)]*\)\))'
