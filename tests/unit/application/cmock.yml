---
:cmock:
  :mock_path: tests/unit/application/mocks
  :mock_prefix: mock_
  :verbosity: 2
  :enforce_strict_ordering: true
  :plugins:
    - :ignore
    - :ignore_arg
    - :expect_any_args
    - :callback
    - :return_thru_ptr
  :when_no_prototypes: :warn
  :treat_externs: :include
  :treat_as_void:
    - DEV_Buzzer_s
  :strippables:
    - '(?:__attribute__\s*\(\([^)]*\)\))'
